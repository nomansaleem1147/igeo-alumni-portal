services:
  - type: web
    name: igeo-alumni-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: REGISTRATION_FEE
        value: "5000"
      - key: EVENT_NAME
        value: IGEO Alumni Annual Dinner 2026
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: igeo-alumni-db
          property: connectionString
    disk:
      name: alumni-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: igeo-alumni-db
    databaseName: igeo_alumni
    user: igeo_alumni_user

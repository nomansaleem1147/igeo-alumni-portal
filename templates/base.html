<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ event_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body>
<header class="topbar"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">IG</span><span>IGEO <b>ALUMNI</b></span></a><nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('register') }}">Register</a><a href="{{ url_for('status') }}">Check Status</a><a href="{{ url_for('admin_login') }}">Admin</a></nav></header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>© {{ event_name }} · IGEO Alumni Portal</footer>
</body></html>
